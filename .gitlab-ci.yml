include:
  - project: 'vicione-oss/tooling/templates'
    file: '/CI-Templates/v2/dotnet.yml'

  # Registry components for artifact storage
  - component: $CI_SERVER_FQDN/vicione-oss/tooling/components/registry/upload@v0.1.1
    inputs:
      name: "Upload artifacts arm64"
      stage: artifacts
      file: "artifacts.tar.gz"
      remote_name: "${ARTIFACT_PREFIX}-${CI_PIPELINE_ID}-linux-arm64.tar.gz"
      package_name: $PACKAGE_NAME
      rules:
        - if: '$CI_COMMIT_TAG'
          when: manual
          allow_failure: true
        - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
        - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
        - if: '$CI_PIPELINE_SOURCE == "web"'
      tags: ["saas-linux-small-arm64"]

  - component: $CI_SERVER_FQDN/vicione-oss/tooling/components/registry/upload@v0.1.1
    inputs:
      name: "Upload artifacts x64"
      stage: artifacts
      file: "artifacts.tar.gz"
      remote_name: "${ARTIFACT_PREFIX}-${CI_PIPELINE_ID}-linux-x64.tar.gz"
      package_name: $PACKAGE_NAME
      rules:
        - if: '$CI_COMMIT_TAG'
          when: manual
          allow_failure: true
        - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
        - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
        - if: '$CI_PIPELINE_SOURCE == "web"'

  - component: $CI_SERVER_FQDN/vicione-oss/tooling/components/registry/cleanup@v0.1.1
    inputs:
      name: "Cleanup old packages"
      stage: cleanup
      package_name: $PACKAGE_NAME
      hours: "4"
      rules:
        - if: '$CI_PIPELINE_SOURCE == "schedule"'

variables:
  DOTNET_VERSION: 9.0.307
  PACKAGE_NAME: "ci-artifacts"
  ARTIFACT_PREFIX: "hostmanagement"
  DEB_PACKAGING_PROJECT: 'vicione-oss/vicione/os/deb-packaging'
  DEB_PACKAGING_BRANCH: 'feature/replace-s3-with-package-registry'

stages:
  - lint
  - build
  - test
  - artifacts
  - packaging
  - deploy
  - release
  - release-public
  - cleanup

default:
  image: mcr.microsoft.com/dotnet/sdk:${DOTNET_VERSION}

#################### Rules

.rules_default_branch: &rules_default_branch
  if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

.rules_merge_request: &rules_merge_request
  if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

.rules_merge_request_manual: &rules_merge_request_manual
  if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  when: manual
  allow_failure: true

.rules_web: &rules_web
  if: '$CI_PIPELINE_SOURCE == "web"'

.rules_web_manual: &rules_web_manual
  if: '$CI_PIPELINE_SOURCE == "web"'
  when: manual
  allow_failure: true

.rules_tag_manual: &rules_tag_manual
  if: '$CI_COMMIT_TAG'
  when: manual
  allow_failure: true

.rules_scheduled: &rules_scheduled
  if: '$CI_PIPELINE_SOURCE == "schedule"'

#################### Common

.install_project_prerequisites: &install_project_prerequisites
  - apt update && apt install -y clang zlib1g-dev

.install_dotnet: &install_dotnet
  - apt update && apt install -y wget libicu-dev
  - wget https://dot.net/v1/dotnet-install.sh -O dotnet-install.sh
  - chmod +x dotnet-install.sh
  - ./dotnet-install.sh --version ${DOTNET_VERSION}
  - export PATH="${PATH}:/root/.dotnet"
  - dotnet --version

.publish_project: &publish_project
  - !reference [.nuget_credentials]
  - !reference [.prepare_directory]
  - dotnet publish -r "${DOTNET_ARCH}" -o "${ABSOLUTE_DIRECTORY}" "${PROJECT}"
  - ls -larth "${ABSOLUTE_DIRECTORY}"

# Build artifacts only - upload is handled by registry component
.create_artifacts: &create_artifacts
  - du -sh ./${DIRECTORY}/
  - rm -rf ./${DIRECTORY}/*.xml ./${DIRECTORY}/*.dbg ./${DIRECTORY}/*.pdb
  - du -sh ./${DIRECTORY}/
  - tar cfz ${DIRECTORY}.tar.gz ./${DIRECTORY}
  - ls -lh ${DIRECTORY}.tar.gz

.jfrog-package-release:
  stage: deploy
  image: releases-docker.jfrog.io/jfrog/jfrog-cli-v2-jf
  variables:
    SERVER: "https://ifm.jfrog.io/artifactory"
    USER: ${Raw_User_RW_JFrog}
    PASSWORD: ${Raw_PW_RW_JFrog}
    REPOSITORY_DESTINATION: "vicione-suite-dev"
  before_script:
    - apk add --no-cache curl jq bash
    - jf config add --user $USER --password ${PASSWORD} --artifactory-url ${SERVER} jfrog
    - jf config use jfrog
  script:
    - source build/jfrog_release.sh
    - jfrog::set_version
    - jfrog::create_artifacts_list "${ARTIFACT_PREFIX}"
    - jfrog::release_packages "${REPOSITORY_DESTINATION}" "hostmanagements"
    - jfrog::cleanup_registry
  artifacts:
    paths:
      - ${ARTIFACT_PREFIX}_*.deb
      - artifacts.list
  when: manual
  rules:
    - <<: *rules_merge_request_manual
    - <<: *rules_web_manual

#################### Lint stage

Markdown:
  stage: lint
  image:
    name: davidanson/markdownlint-cli2:latest
    entrypoint: ["/bin/sh", "-c"]
  script:
    - markdownlint-cli2 "/builds/**/*.md" "#/builds/**/.gitlab/**"
  rules:
    - <<: *rules_tag_manual
      changes:
        - "**/*.md"
    - <<: *rules_default_branch
      changes:
        - "**/*.md"
    - <<: *rules_merge_request
      changes:
        - "**/*.md"
    - <<: *rules_web
      changes:
        - "**/*.md"

#################### Build stage

Build:
  extends: .dotnet-build

#################### Test stage

xUnit:
  extends: .dotnet-test-xunit

#################### Artifacts stage

Build artifacts arm64:
  stage: artifacts
  image: debian:11
  variables:
    DOTNET_ARCH: 'linux-arm64'
    DIRECTORY: 'artifacts'
    PROJECT: 'src/HostManagement/HostManagement.csproj'
  before_script:
    - *install_project_prerequisites
    - *install_dotnet
  script:
    - *publish_project
    - *create_artifacts
  artifacts:
    paths:
      - artifacts.tar.gz
    expire_in: 30 days
  tags:
    - saas-linux-small-arm64
  when: manual
  rules:
    - <<: *rules_tag_manual
    - <<: *rules_default_branch
    - <<: *rules_merge_request
    - <<: *rules_web

Build artifacts x64:
  stage: artifacts
  image: debian:11
  variables:
    DOTNET_ARCH: 'linux-x64'
    DIRECTORY: 'artifacts'
    PROJECT: 'src/HostManagement/HostManagement.csproj'
  before_script:
    - *install_project_prerequisites
    - *install_dotnet
  script:
    - *publish_project
    - *create_artifacts
  artifacts:
    paths:
      - artifacts.tar.gz
    expire_in: 30 days
  when: manual
  rules:
    - <<: *rules_tag_manual
    - <<: *rules_default_branch
    - <<: *rules_merge_request
    - <<: *rules_web

# Upload jobs are created by registry component includes above
# They will automatically pick up artifacts.tar.gz from build jobs

# Configure upload job dependencies
Upload artifacts arm64:
  needs:
    - job: "Build artifacts arm64"
      artifacts: true

Upload artifacts x64:
  needs:
    - job: "Build artifacts x64"
      artifacts: true

Versioning:
  stage: artifacts
  image: debian:11
  script:
    - echo "APP_PIPELINE=${CI_PIPELINE_ID}" >>version.env
    - echo "APP_VERSION=$(cat VERSION)" >>version.env
    - echo "APP_TAG=${CI_COMMIT_TAG}" >>version.env
    - cat version.env
  artifacts:
    reports:
      dotenv: version.env
    expire_in: 30 days
  when: manual
  rules:
    - <<: *rules_tag_manual
    - <<: *rules_default_branch
    - <<: *rules_merge_request
    - <<: *rules_web

#################### Packaging stage

trigger deb packaging:
  stage: packaging
  variables:
    APP_PIPELINE: ${APP_PIPELINE}
    APP_VERSION: ${APP_VERSION}
    APP_TAG: ${APP_TAG}
    PARENT_PROJECT_ID: ${CI_PROJECT_ID}
    ARTIFACT_PREFIX: "hostmanagement"
  trigger:
    project: ${DEB_PACKAGING_PROJECT}
    branch: ${DEB_PACKAGING_BRANCH}
    strategy: depend
  needs:
    - "Upload artifacts arm64"
    - "Upload artifacts x64"
    - job: "Versioning"
      artifacts: true
  when: manual
  rules:
    - <<: *rules_tag_manual
    - <<: *rules_default_branch
    - <<: *rules_merge_request
    - <<: *rules_web

#################### Deploy stage

Test Registry Components:
  stage: deploy
  image: curlimages/curl:latest
  variables:
    TEST_FILE: "test-${CI_PIPELINE_ID}.txt"
    TEST_PACKAGE: "component-test"
  script:
    - |
      echo "[INF] Testing Registry Components"
      echo "[INF] Project: ${CI_PROJECT_ID} | Pipeline: ${CI_PIPELINE_ID}"
    - |
      # Create test file
      echo "Test content from pipeline ${CI_PIPELINE_ID}" > "${TEST_FILE}"
    - |
      # Test Upload
      echo "[INF] Testing upload..."
      HTTP_CODE=$(curl --silent --write-out "%{http_code}" --output /dev/null \
        --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
        --upload-file "${TEST_FILE}" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/${TEST_PACKAGE}/${CI_PIPELINE_ID}/${TEST_FILE}")
      if [ "$HTTP_CODE" = "201" ]; then
        echo "[INF] Upload successful (HTTP ${HTTP_CODE})"
      else
        echo "[ERR] Upload failed (HTTP ${HTTP_CODE})"
        exit 1
      fi
    - |
      # Test Download
      echo "[INF] Testing download..."
      HTTP_CODE=$(curl --silent --write-out "%{http_code}" \
        --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
        --output "downloaded-${TEST_FILE}" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/${TEST_PACKAGE}/${CI_PIPELINE_ID}/${TEST_FILE}")
      if [ "$HTTP_CODE" = "200" ]; then
        echo "[INF] Download successful (HTTP ${HTTP_CODE})"
        echo "[INF] Downloaded content:"
        cat "downloaded-${TEST_FILE}"
      else
        echo "[ERR] Download failed (HTTP ${HTTP_CODE})"
        exit 1
      fi
    - |
      # Test Cleanup (delete the test package)
      echo "[INF] Testing cleanup (delete)..."
      # Get package ID
      PACKAGE_ID=$(curl --silent \
        --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages?package_name=${TEST_PACKAGE}" \
        | sed -n 's/.*"id":\([0-9]*\).*/\1/p' | head -1)
      if [ -n "$PACKAGE_ID" ]; then
        HTTP_CODE=$(curl --silent --write-out "%{http_code}" --output /dev/null \
          --request DELETE \
          --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
          "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/${PACKAGE_ID}")
        if [ "$HTTP_CODE" = "204" ] || [ "$HTTP_CODE" = "200" ]; then
          echo "[INF] Cleanup successful (HTTP ${HTTP_CODE})"
        else
          echo "[WRN] Cleanup returned HTTP ${HTTP_CODE}"
        fi
      else
        echo "[WRN] Could not find package ID for cleanup"
      fi
    - echo "[INF] All registry component operations tested successfully!"
  when: manual
  allow_failure: true
  rules:
    - <<: *rules_tag_manual
    - <<: *rules_default_branch
    - <<: *rules_merge_request
    - <<: *rules_web

Deploy Shared NuGet:
  extends: .dotnet-deploy-nuget
  variables:
    PROJECT: 'src/HostManagement.Shared/HostManagement.Shared.csproj'
    REPO: 'JFrogViciOne'

Deploy Shared.Communication NuGet:
  extends: .dotnet-deploy-nuget
  variables:
    PROJECT: 'src/HostManagement.Shared.Communication/HostManagement.Shared.Communication.csproj'
    REPO: 'JFrogViciOne'

Prerelease Packages to JFrog:
  extends: .jfrog-package-release
  variables:
    SERVER: "https://ifm.jfrog.io/artifactory"
    USER: ${Raw_User_RW_JFrog}
    PASSWORD: ${Raw_PW_RW_JFrog}
    REPOSITORY_DESTINATION: "vicione-suite-dev"
  needs:
    - "trigger deb packaging"

#################### Release stage

Release Shared NuGet:
  extends: .dotnet-release-nuget
  variables:
    PROJECT: 'src/HostManagement.Shared/HostManagement.Shared.csproj'
    REPO: 'JFrogViciOne'

Release Shared.Communication NuGet:
  extends: .dotnet-release-nuget
  variables:
    PROJECT: 'src/HostManagement.Shared.Communication/HostManagement.Shared.Communication.csproj'
    REPO: 'JFrogViciOne'

Release Packages to JFrog:
  extends: .jfrog-package-release
  stage: release
  variables:
    SERVER: "https://ifm.jfrog.io/artifactory"
    USER: ${Raw_User_RW_JFrog}
    PASSWORD: ${Raw_PW_RW_JFrog}
    REPOSITORY_DESTINATION: "vicione-suite-staging"
  needs:
    - "trigger deb packaging"
  rules:
    - <<: *rules_tag_manual

#################### Release Public stage

Public-Release Packages to JFrog:
  extends: .jfrog-package-release
  stage: release-public
  variables:
    SERVER: "https://ifm.jfrog.io/artifactory"
    USER: ${Raw_User_RW_JFrog}
    PASSWORD: ${Raw_PW_RW_JFrog}
    REPOSITORY_SOURCE: "vicione-suite-staging"
    REPOSITORY_DESTINATION: "vicione-suite"
  script:
    - source build/jfrog_release.sh
    - jfrog::promote_packages "${REPOSITORY_SOURCE}" "${REPOSITORY_DESTINATION}"
  needs:
    - "Release Packages to JFrog"
  rules:
    - <<: *rules_tag_manual

#################### Cleanup stage
# Cleanup job is created by registry component include above
