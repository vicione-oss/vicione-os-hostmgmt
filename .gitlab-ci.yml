include:
  - project: 'vicione-oss/tooling/templates'
    file: '/CI-Templates/v2/dotnet.yml'

variables:
  DOTNET_VERSION: 9.0.307
  # Package Registry settings
  PACKAGE_NAME: "ci-artifacts"
  ARTIFACT_PREFIX: "hostmanagement"
  # Child pipeline project (for testing, use feature branch)
  DEB_PACKAGING_PROJECT: 'vicione-oss/vicione/os/deb-packaging'
  DEB_PACKAGING_BRANCH: 'feature/replace-s3-with-package-registry'  # Change to 'master' after testing

stages:
  - lint
  - build
  - test
  - artifacts
  - packaging
  - deploy
  - release
  - release-public
  - cleanup

default:
  image: mcr.microsoft.com/dotnet/sdk:${DOTNET_VERSION}

#################### Rules

.rules_default_branch: &rules_default_branch
  if : '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

.rules_merge_request: &rules_merge_request
  if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

.rules_merge_request_manual: &rules_merge_request_manual
  if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  when: manual
  allow_failure: true

.rules_web: &rules_web
  if: '$CI_PIPELINE_SOURCE == "web"'

.rules_web_manual: &rules_web_manual
  if: '$CI_PIPELINE_SOURCE == "web"'
  when: manual
  allow_failure: true

.rules_tag_manual: &rules_tag_manual
  if: '$CI_COMMIT_TAG'
  when: manual
  allow_failure: true

.rules_scheduled: &rules_scheduled
  if: '$CI_PIPELINE_SOURCE == "schedule"'

#################### Common

.install_project_prerequisites: &install_project_prerequisites
  - apt update && apt install -y clang zlib1g-dev

.install_dotnet: &install_dotnet
  - apt update && apt install -y wget libicu-dev
  - wget https://dot.net/v1/dotnet-install.sh -O dotnet-install.sh
  - chmod +x dotnet-install.sh
  - ./dotnet-install.sh --version ${DOTNET_VERSION}
  - export PATH="${PATH}:/root/.dotnet"
  - dotnet --version

.publish_project: &publish_project
  - !reference [.nuget_credentials]
  - !reference [.prepare_directory]
  - dotnet publish -r "${DOTNET_ARCH}" -o "${ABSOLUTE_DIRECTORY}" "${PROJECT}"
  - ls -larth "${ABSOLUTE_DIRECTORY}"

.create_artifacts: &create_artifacts
  - du -sh ./${DIRECTORY}/
  - rm -rf ./${DIRECTORY}/*.xml ./${DIRECTORY}/*.dbg ./${DIRECTORY}/*.pdb
  - du -sh ./${DIRECTORY}/
  - tar cfz ${DIRECTORY}.tar.gz ./${DIRECTORY}
  # Upload to GitLab Package Registry
  - |
    ARTIFACT_FILE="${ARTIFACT_PREFIX}-${CI_PIPELINE_ID}-${DOTNET_ARCH}.tar.gz"
    echo "Uploading ${ARTIFACT_FILE} to Package Registry"
    curl --fail --silent --show-error \
      --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
      --upload-file "${DIRECTORY}.tar.gz" \
      "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/${PACKAGE_NAME}/${CI_PIPELINE_ID}/${ARTIFACT_FILE}"

.package_registry_download: &package_registry_download
  # Download artifact from Package Registry
  - |
    echo "Downloading ${artifact} from Package Registry"
    curl --fail --silent --show-error \
      --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
      --output "${artifact}" \
      "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/${PACKAGE_NAME}/${APP_PIPELINE}/${artifact}"

.package_registry_delete: &package_registry_delete
  # Delete artifact from Package Registry
  - |
    echo "Deleting ${artifact} from Package Registry"
    curl --fail --silent --show-error \
      --request DELETE \
      --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
      "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/${PACKAGE_NAME}/${APP_PIPELINE}/${artifact}" || true

.jfrog-package-release:
  stage: deploy
  image: releases-docker.jfrog.io/jfrog/jfrog-cli-v2-jf
  variables:
    SERVER: "https://ifm.jfrog.io/artifactory"
    USER: ${Raw_User_RW_JFrog}
    PASSWORD: ${Raw_PW_RW_JFrog}
    REPOSITORY_DESTINATION: "vicione-suite-dev"
  before_script:
    - apk add --no-cache curl
    - jf config add --user $USER --password ${PASSWORD} --artifactory-url ${SERVER} jfrog
    - jf config use jfrog
  script:
    - APP_PIPELINE="${CI_PIPELINE_ID}"
    - APP_VERSION="$(cat VERSION)"
    - APP_TAG="${CI_COMMIT_TAG}"
    - VERSION="${APP_VERSION}"
    - if [[ -z "${APP_TAG}" ]]; then VERSION="${VERSION}~${APP_PIPELINE}"; fi
    # List of artifacts to process
    - echo "${ARTIFACT_PREFIX}_${VERSION}_amd64.deb" >> artifacts.list
    - echo "${ARTIFACT_PREFIX}_${VERSION}_arm64.deb" >> artifacts.list
    - echo "${ARTIFACT_PREFIX}-${APP_PIPELINE}-linux-x64.tar.gz" >> artifacts.list
    - echo "${ARTIFACT_PREFIX}-${APP_PIPELINE}-linux-arm64.tar.gz" >> artifacts.list
    - |
      while IFS= read -r artifact; do
        echo "Processing artifact: $artifact"
        if [[ "${artifact}" == *.deb ]]; then
          # Download .deb from Package Registry
          echo "Downloading ${artifact} from Package Registry"
          curl --fail --silent --show-error \
            --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
            --output "${artifact}" \
            "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/${PACKAGE_NAME}/${APP_PIPELINE}/${artifact}"
          # Upload to JFrog
          echo "Uploading ${artifact} to JFrog"
          jf rt upload "${artifact}" "${REPOSITORY_DESTINATION}/hostmanagements/${artifact}"
        fi
        # Delete from Package Registry (cleanup)
        echo "Deleting ${artifact} from Package Registry"
        curl --silent --show-error \
          --request DELETE \
          --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
          "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/${PACKAGE_NAME}/${APP_PIPELINE}/${artifact}" || echo "Warning: Could not delete ${artifact}"
      done < artifacts.list
  artifacts:
    paths:
      - ${ARTIFACT_PREFIX}_*.deb
      - artifacts.list
  when: manual
  rules:
    - <<: *rules_merge_request_manual
    - <<: *rules_web_manual

#################### Lint stage

Markdown:
  stage: lint
  image:
    name: davidanson/markdownlint-cli2:latest
    entrypoint: ["/bin/sh", "-c"]
  script:
    - markdownlint-cli2 "/builds/**/*.md" "#/builds/**/.gitlab/**"
  rules:
    - <<: *rules_tag_manual
      changes:
        - "**/*.md"
    - <<: *rules_default_branch
      changes:
        - "**/*.md"
    - <<: *rules_merge_request
      changes:
        - "**/*.md"
    - <<: *rules_web
      changes:
        - "**/*.md"

#################### Build stage

Build:
  extends: .dotnet-build

####################  Test stage

xUnit:
  extends: .dotnet-test-xunit

#################### Artifacts stage

Create artifacts arm64:
  stage: artifacts
  image: debian:11
  variables:
    DOTNET_ARCH: 'linux-arm64'
    DIRECTORY: 'artifacts'
    PROJECT: 'src/HostManagement/HostManagement.csproj'
  before_script:
    - *install_project_prerequisites
    - *install_dotnet
    - apt update && apt install -y curl
  script:
    - *publish_project
    - *create_artifacts
  artifacts:
    paths:
      - artifacts.tar.gz
    expire_in: 7 days
  tags:
    - saas-linux-small-arm64
  when: manual
  rules:
    - <<: *rules_tag_manual
    - <<: *rules_default_branch
    - <<: *rules_merge_request
    - <<: *rules_web

Create artifacts x64:
  stage: artifacts
  image: debian:11
  variables:
    DOTNET_ARCH: 'linux-x64'
    DIRECTORY: 'artifacts'
    PROJECT: 'src/HostManagement/HostManagement.csproj'
  before_script:
    - *install_project_prerequisites
    - *install_dotnet
    - apt update && apt install -y curl
  script:
    - *publish_project
    - *create_artifacts
  artifacts:
    paths:
      - artifacts.tar.gz
    expire_in: 7 days
  when: manual
  rules:
    - <<: *rules_tag_manual
    - <<: *rules_default_branch
    - <<: *rules_merge_request
    - <<: *rules_web

Versioning:
  stage: artifacts
  image: debian:11
  script:
    - echo "APP_PIPELINE=${CI_PIPELINE_ID}" >>version.env
    - echo "APP_VERSION=$(cat VERSION)" >>version.env
    - echo "APP_TAG=${CI_COMMIT_TAG}" >>version.env
    - cat version.env
  artifacts:
    reports:
      dotenv: version.env
    expire_in: 7 days
  when: manual
  rules:
    - <<: *rules_tag_manual
    - <<: *rules_default_branch
    - <<: *rules_merge_request
    - <<: *rules_web

#################### Packaging stage

trigger deb packaging:
  stage: packaging
  variables:
    APP_PIPELINE: ${APP_PIPELINE}
    APP_VERSION: ${APP_VERSION}
    APP_TAG: ${APP_TAG}
    PARENT_PROJECT_ID: ${CI_PROJECT_ID}
    ARTIFACT_PREFIX: "hostmanagement"
  trigger:
    project: ${DEB_PACKAGING_PROJECT}
    branch: ${DEB_PACKAGING_BRANCH}
    strategy: depend
  needs:
    - "Create artifacts arm64"
    - "Create artifacts x64"
    - job: "Versioning"
      artifacts: true
  when: manual
  rules:
    - <<: *rules_tag_manual
    - <<: *rules_default_branch
    - <<: *rules_merge_request
    - <<: *rules_web

####################  Deploy stage

# TEST JOB: Verify Package Registry connectivity (no actual deployment)
Test Package Registry:
  stage: deploy
  image: debian:11
  before_script:
    - "apt-get update && apt-get install -qq -y curl jq"
  script:
    - "echo '=== Package Registry Connectivity Test ==='"
    - "echo 'Project ID:' ${CI_PROJECT_ID}"
    - "echo 'Pipeline ID:' ${CI_PIPELINE_ID}"
    - "echo 'Package Name:' ${PACKAGE_NAME}"
    - "echo 'Artifact Prefix:' ${ARTIFACT_PREFIX}"
    - |
      APP_PIPELINE="${CI_PIPELINE_ID}"
      APP_VERSION="$(cat VERSION)"
      VERSION="${APP_VERSION}~${APP_PIPELINE}"
      echo "=== Expected artifacts ==="
      echo "  - ${ARTIFACT_PREFIX}-${APP_PIPELINE}-linux-x64.tar.gz"
      echo "  - ${ARTIFACT_PREFIX}-${APP_PIPELINE}-linux-arm64.tar.gz"
      echo ""
      echo "=== Listing packages in Package Registry ==="
      curl --silent --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages?per_page=20" | jq '.'
      echo ""
      echo "=== Attempting to download artifacts ==="
      for arch in "linux-x64" "linux-arm64"; do
        artifact="${ARTIFACT_PREFIX}-${APP_PIPELINE}-${arch}.tar.gz"
        echo "Downloading: ${artifact}"
        HTTP_CODE=$(curl --silent --write-out "%{http_code}" \
          --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
          --output "${artifact}" \
          "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/${PACKAGE_NAME}/${APP_PIPELINE}/${artifact}")
        if [ "$HTTP_CODE" = "200" ]; then
          SIZE=$(ls -lh ${artifact} | awk '{print $5}')
          echo "  SUCCESS (HTTP ${HTTP_CODE}) - Size: ${SIZE}"
        else
          echo "  FAILED (HTTP ${HTTP_CODE})"
        fi
      done
      echo ""
      echo "=== Cleanup: Deleting test artifacts ==="
      for arch in "linux-x64" "linux-arm64"; do
        artifact="${ARTIFACT_PREFIX}-${APP_PIPELINE}-${arch}.tar.gz"
        echo "Deleting: ${artifact}"
        HTTP_CODE=$(curl --silent --write-out "%{http_code}" --output /dev/null \
          --request DELETE \
          --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
          "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/${PACKAGE_NAME}/${APP_PIPELINE}/${artifact}")
        echo "  Result: HTTP ${HTTP_CODE}"
      done
      echo ""
      echo "=== Test Complete ==="
  needs:
    - "trigger deb packaging"
  when: manual
  allow_failure: true
  rules:
    - <<: *rules_tag_manual
    - <<: *rules_default_branch
    - <<: *rules_merge_request
    - <<: *rules_web
  tags:
    - saas-linux-medium-amd64

Deploy Shared NuGet:
  extends: .dotnet-deploy-nuget
  variables:
    PROJECT: 'src/HostManagement.Shared/HostManagement.Shared.csproj'
    REPO: 'JFrogViciOne'

Deploy Shared.Communication NuGet:
  extends: .dotnet-deploy-nuget
  variables:
    PROJECT: 'src/HostManagement.Shared.Communication/HostManagement.Shared.Communication.csproj'
    REPO: 'JFrogViciOne'

Prerelease Packages to JFrog:
  extends: .jfrog-package-release
  variables:
    SERVER: "https://ifm.jfrog.io/artifactory"
    USER: ${Raw_User_RW_JFrog}
    PASSWORD: ${Raw_PW_RW_JFrog}
    REPOSITORY_DESTINATION: "vicione-suite-dev"
  needs:
    - "trigger deb packaging"

####################  Release stage

Release Shared NuGet:
  extends: .dotnet-release-nuget
  variables:
    PROJECT: 'src/HostManagement.Shared/HostManagement.Shared.csproj'
    REPO: 'JFrogViciOne'

Release Shared.Communication NuGet:
  extends: .dotnet-release-nuget
  variables:
    PROJECT: 'src/HostManagement.Shared.Communication/HostManagement.Shared.Communication.csproj'
    REPO: 'JFrogViciOne'

Release Packages to JFrog:
  extends: .jfrog-package-release
  stage: release
  variables:
    SERVER: "https://ifm.jfrog.io/artifactory"
    USER: ${Raw_User_RW_JFrog}
    PASSWORD: ${Raw_PW_RW_JFrog}
    REPOSITORY_DESTINATION: "vicione-suite-staging"
  needs:
    - "trigger deb packaging"
  rules:
    - <<: *rules_tag_manual

#################### Release Public stage

Public-Release Packages to JFrog:
  extends: .jfrog-package-release
  stage: release-public
  variables:
    SERVER: "https://ifm.jfrog.io/artifactory"
    USER: ${Raw_User_RW_JFrog}
    PASSWORD: ${Raw_PW_RW_JFrog}
    REPOSITORY_SOURCE: "vicione-suite-staging"
    REPOSITORY_DESTINATION: "vicione-suite"
  script:
    - |
      while IFS= read -r artifact; do
        echo "Process artifact: $artifact"
        if [[ "${artifact}" == *.deb ]]; then
          source="${REPOSITORY_SOURCE}/*/${artifact}"
          destination="${REPOSITORY_DESTINATION}/${artifact}"

          echo "Moving artifact: from \"${REPOSITORY_SOURCE}\" to \"${REPOSITORY_DESTINATION}\""
          jf rt mv "${source}" "${destination}"
        fi
      done < artifacts.list
  needs:
    - "Release Packages to JFrog"
  rules:
    - <<: *rules_tag_manual

#################### Cleanup stage

# Safety net cleanup - runs on schedule to delete orphaned artifacts
# Deletes packages older than 4 hours
Cleanup orphaned packages:
  stage: cleanup
  image: debian:11
  before_script:
    - apt update && apt install -y curl jq
  script:
    - |
      echo "=== Cleaning up orphaned packages from Package Registry ==="
      CUTOFF_TIME=$(date -d '4 hours ago' +%Y-%m-%dT%H:%M:%SZ 2>/dev/null || date -v-4H +%Y-%m-%dT%H:%M:%SZ)
      echo "Deleting packages created before: ${CUTOFF_TIME}"

      # List all package versions
      PACKAGES=$(curl --silent --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages?package_name=${PACKAGE_NAME}&per_page=100" | jq -r '.[].id')

      for pkg_id in $PACKAGES; do
        # Get package details
        PKG_INFO=$(curl --silent --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
          "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/${pkg_id}")

        CREATED_AT=$(echo "$PKG_INFO" | jq -r '.created_at')
        VERSION=$(echo "$PKG_INFO" | jq -r '.version')

        if [[ "$CREATED_AT" < "$CUTOFF_TIME" ]]; then
          echo "Deleting old package version: ${VERSION} (created: ${CREATED_AT})"
          curl --silent --request DELETE --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
            "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/${pkg_id}" || true
        fi
      done
      echo "=== Cleanup complete ==="
  rules:
    - <<: *rules_scheduled
  tags:
    - saas-linux-medium-amd64
