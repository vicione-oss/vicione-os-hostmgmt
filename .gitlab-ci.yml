variables:
  VICIONE_IMAGE: registry.gitlab.com/vicione-oss/tooling/base-image:vicione-latest
  PACKAGE_NAME: "ci-artifacts"
  ARTIFACT_PREFIX: "hostmanagement"
  DEB_PACKAGING_PROJECT: 'vicione-oss/vicione/os/deb-packaging'
  DEB_PACKAGING_BRANCH: 'master'
  RUNNER_TAG: saas-linux-large-amd64

.activate_mise: &activate_mise
  - mise install
  - eval "$(mise env)"

.update_nuget_source_ro: &update_nuget_source_ro
  - dotnet nuget update source JFrogNuGetProxy --configfile NuGet.Config -u $NuGet_User_JFrog -p $NuGet_PW_JFrog --store-password-in-clear-text
  - dotnet nuget update source JFrogViciOne --configfile NuGet.Config -u $NuGet_User_JFrog -p $NuGet_PW_JFrog --store-password-in-clear-text

include:
  - project: 'vicione-oss/tooling/templates'
    file: '/CI-Templates/v2/dotnet.yml'

  # Registry components for artifact storage
  - component: $CI_SERVER_FQDN/vicione-oss/tooling/components/registry/upload@v0.1.2
    inputs:
      name: "Upload artifacts arm64"
      stage: artifacts
      file: "artifacts.tar.gz"
      remote_name: "${ARTIFACT_PREFIX}-${CI_PIPELINE_ID}-linux-arm64.tar.gz"
      package_name: $PACKAGE_NAME
      rules:
        - if: '$CI_COMMIT_TAG'
          when: manual
          allow_failure: true
        - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
        - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
        - if: '$CI_PIPELINE_SOURCE == "web"'

  - component: $CI_SERVER_FQDN/vicione-oss/tooling/components/registry/upload@v0.1.2
    inputs:
      name: "Upload artifacts x64"
      stage: artifacts
      file: "artifacts.tar.gz"
      remote_name: "${ARTIFACT_PREFIX}-${CI_PIPELINE_ID}-linux-x64.tar.gz"
      package_name: $PACKAGE_NAME
      rules:
        - if: '$CI_COMMIT_TAG'
          when: manual
          allow_failure: true
        - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
        - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
        - if: '$CI_PIPELINE_SOURCE == "web"'

  - component: $CI_SERVER_FQDN/vicione-oss/tooling/components/registry/cleanup@v0.1.2
    inputs:
      name: "Cleanup old packages"
      stage: cleanup
      package_name: $PACKAGE_NAME
      hours: "4"
      rules:
        - if: '$CI_PIPELINE_SOURCE == "schedule"'

  # Build & Test
  - component: $CI_SERVER_FQDN/vicione-oss/tooling/dotnet-component/dotnet-restore@2.2.4
    inputs:
      image: $VICIONE_IMAGE
      rules:
        - if: '$CI_COMMIT_TAG'
        - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
        - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
        - if: '$CI_PIPELINE_SOURCE == "web"'
      before_script:
        - *activate_mise
        - *update_nuget_source_ro
      tags:
        - $RUNNER_TAG
  - component: $CI_SERVER_FQDN/vicione-oss/tooling/dotnet-component/dotnet-build@2.2.4
    inputs:
      image: $VICIONE_IMAGE
      rules:
        - if: '$CI_COMMIT_TAG'
        - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
        - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
        - if: '$CI_PIPELINE_SOURCE == "web"'
      before_script:
        - *activate_mise
        - echo "$Version"
      tags:
        - $RUNNER_TAG
  - component: $CI_SERVER_FQDN/vicione-oss/tooling/dotnet-component/dotnet-test@2.2.4
    inputs:
      image: $VICIONE_IMAGE
      rules:
        - if: '$CI_COMMIT_TAG'
          when: manual
          allow_failure: true
        - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
        - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
        - if: '$CI_PIPELINE_SOURCE == "web"'
      before_script:
        - *activate_mise
        - *update_nuget_source_ro
      tags:
        - $RUNNER_TAG
      coverage: true

  # JFrog components for artifact releases
  - component: $CI_SERVER_FQDN/vicione-oss/tooling/components/jfrog/release@v0.1.0
    inputs:
      name: "Prerelease Packages to JFrog"
      stage: deploy
      repository: "vicione-suite-dev"
      upload_path: "hostmanagements"
      artifact_prefix: "hostmanagement"
      package_name: "ci-artifacts"
      rules:
        - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
          when: manual
          allow_failure: true
        - if: '$CI_PIPELINE_SOURCE == "web"'
          when: manual
          allow_failure: true

  - component: $CI_SERVER_FQDN/vicione-oss/tooling/components/jfrog/release@v0.1.0
    inputs:
      name: "Release Packages to JFrog"
      stage: release
      repository: "vicione-suite-staging"
      upload_path: "hostmanagements"
      artifact_prefix: "hostmanagement"
      package_name: "ci-artifacts"
      rules:
        - if: '$CI_COMMIT_TAG'
          when: manual
          allow_failure: true

  - component: $CI_SERVER_FQDN/vicione-oss/tooling/components/jfrog/promote@v0.1.0
    inputs:
      name: "Public-Release Packages to JFrog"
      stage: release-public
      source_repository: "vicione-suite-staging"
      destination_repository: "vicione-suite"
      artifact_prefix: "hostmanagement"
      rules:
        - if: '$CI_COMMIT_TAG'
          when: manual
          allow_failure: true

stages:
  - lint
  - build
  - test
  - artifacts
  - packaging
  - deploy
  - release
  - release-public
  - cleanup

default:
  image: $VICIONE_IMAGE
  tags:
    - $RUNNER_TAG
  before_script:
    - *activate_mise

Version:
  stage: .pre
  script:
    - if [[ -f "VERSION" ]]; then VERSION=$(head -n 1 VERSION); fi
    - if [[ ! -z "${CI_COMMIT_TAG}" ]]; then VERSION=$(echo $CI_COMMIT_TAG | sed 's/v//g'); fi
    - if [[ -z "${VERSION}" ]]; then VERSION='0.1.0'; fi
    - if [[ -z "${CI_COMMIT_TAG}" ]]; then VERSION="${VERSION}-ci${CI_PIPELINE_ID}"; fi
    - echo "Version=${VERSION}" >> version.env
    - echo "PackageVersion=${VERSION}" >> version.env
    - cat version.env
  artifacts:
    reports:
      dotenv: version.env

#################### Rules

.rules_default_branch: &rules_default_branch
  if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

.rules_merge_request: &rules_merge_request
  if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

.rules_merge_request_manual: &rules_merge_request_manual
  if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  when: manual
  allow_failure: true

.rules_web: &rules_web
  if: '$CI_PIPELINE_SOURCE == "web"'

.rules_web_manual: &rules_web_manual
  if: '$CI_PIPELINE_SOURCE == "web"'
  when: manual
  allow_failure: true

.rules_tag_manual: &rules_tag_manual
  if: '$CI_COMMIT_TAG'
  when: manual
  allow_failure: true

.rules_scheduled: &rules_scheduled
  if: '$CI_PIPELINE_SOURCE == "schedule"'

#################### Common

.publish_project: &publish_project
  - !reference [.nuget_credentials]
  - !reference [.prepare_directory]
  - dotnet publish -r "${DOTNET_ARCH}" -o "${ABSOLUTE_DIRECTORY}" "${PROJECT}"
  - ls -larth "${ABSOLUTE_DIRECTORY}"

# Build artifacts only - upload is handled by registry component
.create_artifacts: &create_artifacts
  - du -sh ./${DIRECTORY}/
  - rm -rf ./${DIRECTORY}/*.xml ./${DIRECTORY}/*.dbg ./${DIRECTORY}/*.pdb
  - du -sh ./${DIRECTORY}/
  - tar cfz ${DIRECTORY}.tar.gz ./${DIRECTORY}
  - ls -lh ${DIRECTORY}.tar.gz

#################### Lint stage

Markdown:
  stage: lint
  image: $VICIONE_IMAGE
  script:
    - npm install -g markdownlint-cli2
    - markdownlint-cli2 "**/*.md"
  rules:
    - <<: *rules_tag_manual
      changes:
        - "**/*.md"
    - <<: *rules_default_branch
      changes:
        - "**/*.md"
    - <<: *rules_merge_request
      changes:
        - "**/*.md"
    - <<: *rules_web
      changes:
        - "**/*.md"

#################### Artifacts stage

Build artifacts arm64:
  stage: artifacts
  image: $VICIONE_IMAGE
  variables:
    DOTNET_ARCH: 'linux-arm64'
    DIRECTORY: 'artifacts'
    PROJECT: 'src/HostManagement/HostManagement.csproj'
  script:
    - *publish_project
    - *create_artifacts
  artifacts:
    paths:
      - artifacts.tar.gz
    expire_in: 30 days
  tags:
    - saas-linux-large-arm64
  when: manual
  rules:
    - <<: *rules_tag_manual
    - <<: *rules_default_branch
    - <<: *rules_merge_request
    - <<: *rules_web

Build artifacts x64:
  stage: artifacts
  image: $VICIONE_IMAGE
  variables:
    DOTNET_ARCH: 'linux-x64'
    DIRECTORY: 'artifacts'
    PROJECT: 'src/HostManagement/HostManagement.csproj'
  script:
    - *publish_project
    - *create_artifacts
  artifacts:
    paths:
      - artifacts.tar.gz
    expire_in: 30 days
  when: manual
  rules:
    - <<: *rules_tag_manual
    - <<: *rules_default_branch
    - <<: *rules_merge_request
    - <<: *rules_web

# Upload jobs are created by registry component includes above
# They will automatically pick up artifacts.tar.gz from build jobs

# Configure upload job dependencies (use VICIONE_IMAGE instead of curl - has mise + cached)
# Override tags to use small runners (upload doesn't need large)
Upload artifacts arm64:
  image: $VICIONE_IMAGE
  tags: []
  needs:
    - job: "Build artifacts arm64"
      artifacts: true

Upload artifacts x64:
  image: $VICIONE_IMAGE
  tags: []
  needs:
    - job: "Build artifacts x64"
      artifacts: true

Versioning:
  stage: artifacts
  image: $VICIONE_IMAGE
  script:
    - echo "APP_PIPELINE=${CI_PIPELINE_ID}" >>version.env
    - echo "APP_VERSION=$(cat VERSION)" >>version.env
    - echo "APP_TAG=${CI_COMMIT_TAG}" >>version.env
    - cat version.env
  artifacts:
    reports:
      dotenv: version.env
    expire_in: 30 days
  when: manual
  rules:
    - <<: *rules_tag_manual
    - <<: *rules_default_branch
    - <<: *rules_merge_request
    - <<: *rules_web

#################### Packaging stage

trigger deb packaging:
  stage: packaging
  variables:
    APP_PIPELINE: ${APP_PIPELINE}
    APP_VERSION: ${APP_VERSION}
    APP_TAG: ${APP_TAG}
    PARENT_PROJECT_ID: ${CI_PROJECT_ID}
    ARTIFACT_PREFIX: "hostmanagement"
  trigger:
    project: ${DEB_PACKAGING_PROJECT}
    branch: ${DEB_PACKAGING_BRANCH}
    strategy: depend
  needs:
    - "Upload artifacts arm64"
    - "Upload artifacts x64"
    - job: "Versioning"
      artifacts: true
  when: manual
  rules:
    - <<: *rules_tag_manual
    - <<: *rules_default_branch
    - <<: *rules_merge_request
    - <<: *rules_web

#################### Deploy stage

Deploy Shared NuGet:
  extends: .dotnet-deploy-nuget
  variables:
    PROJECT: 'src/HostManagement.Shared/HostManagement.Shared.csproj'
    REPO: 'JFrogViciOne'

Deploy Shared.Communication NuGet:
  extends: .dotnet-deploy-nuget
  variables:
    PROJECT: 'src/HostManagement.Shared.Communication/HostManagement.Shared.Communication.csproj'
    REPO: 'JFrogViciOne'

# JFrog release jobs are created by jfrog component includes above

# Configure JFrog job dependencies
Prerelease Packages to JFrog:
  needs:
    - "trigger deb packaging"

Release Packages to JFrog:
  needs:
    - "trigger deb packaging"

Public-Release Packages to JFrog:
  needs:
    - "Release Packages to JFrog"

#################### Release stage

Release Shared NuGet:
  extends: .dotnet-release-nuget
  variables:
    PROJECT: 'src/HostManagement.Shared/HostManagement.Shared.csproj'
    REPO: 'JFrogViciOne'

Release Shared.Communication NuGet:
  extends: .dotnet-release-nuget
  variables:
    PROJECT: 'src/HostManagement.Shared.Communication/HostManagement.Shared.Communication.csproj'
    REPO: 'JFrogViciOne'

#################### Cleanup stage
# Cleanup job is created by registry component include above
