include:
  - project: 'acx/tooling/templates'
    file: '/CI-Templates/v2/dotnet.yml'

variables:
  DOTNET_VERSION: 9.0.305

stages:
  - build
  - test
  - artifacts
  - packaging
  - deploy
  - release

default:
  image: mcr.microsoft.com/dotnet/sdk:${DOTNET_VERSION}

.rules_default_branch: &rules_default_branch
  if : '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

.rules_merge_request: &rules_merge_request
  if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

.rules_web: &rules_web
  if: '$CI_PIPELINE_SOURCE == "web"'

.rules_tag_manual: &rules_tag_manual
  if: '$CI_COMMIT_TAG'
  when: manual
  allow_failure: true

.install_project_prerequisites: &install_project_prerequisites
  - apt update && apt install -y clang zlib1g-dev

.install_dotnet: &install_dotnet
  - apt update && apt install -y wget libicu-dev
  - wget https://dot.net/v1/dotnet-install.sh -O dotnet-install.sh
  - chmod +x dotnet-install.sh
  - ./dotnet-install.sh --version ${DOTNET_VERSION}
  - export PATH="${PATH}:/root/.dotnet"
  - dotnet --version

.publish_project: &publish_project
  - !reference [.nuget_credentials]
  - !reference [.prepare_directory]
  - dotnet publish -r "${DOTNET_ARCH}" -o "${ABSOLUTE_DIRECTORY}" "${PROJECT}"
  - ls -larth "${ABSOLUTE_DIRECTORY}"

.create_artifacts: &create_artifacts
  - du -sh ./${DIRECTORY}/
  - rm -rf ./${DIRECTORY}/*.xml ./${DIRECTORY}/*.dbg ./${DIRECTORY}/*.pdb
  - du -sh ./${DIRECTORY}/
  - tar cfz ${DIRECTORY}.tar.gz ./${DIRECTORY}
  - ./mc cp ${DIRECTORY}.tar.gz myminio/acx/hostmanagement-${CI_PIPELINE_ID}-${DOTNET_ARCH}.tar.gz

.set_up_minio_client: &set_up_minio_client
  - apt update && apt install -y curl
  - curl -s https://nexus.nsc-gmbh.de/repository/minio-client/${MINIO_ARCH}/mc -o mc
  - chmod +x mc
  - ./mc alias set myminio "${S3_Url}" "${S3_User}" "${S3_PW}"

Build:
  extends: .dotnet-build

Markdown:
  stage: test
  image:
    name: jfrog.i40.ifm-datalink.net:443/docker-remote/davidanson/markdownlint-cli2:latest
    entrypoint: ["/bin/sh", "-c"]
  script:
    - markdownlint-cli2 "/builds/**/*.md" "#/builds/**/.gitlab/**"
  rules:
    - <<: *rules_tag_manual
      changes:
        - "**/*.md"
    - <<: *rules_default_branch
      changes:
        - "**/*.md"
    - <<: *rules_merge_request
      changes:
        - "**/*.md"
    - <<: *rules_web
      changes:
        - "**/*.md"
  tags:
    - docker

Publish test arm64:
  extends: .dotnet-test-xunit
  variables:
    DOTNET_ARCH: 'linux-arm64'
    DIRECTORY: 'artifacts/publish'
    PROJECT: 'src/HostManagement/HostManagement.csproj'
  before_script:
    - *install_project_prerequisites
  script:
    - *publish_project
  artifacts:
  tags:
    - linux
    - docker
    - arm64

Publish test x64:
  extends: .dotnet-test-xunit
  variables:
    DOTNET_ARCH: 'linux-x64'
    DIRECTORY: 'artifacts/publish'
    PROJECT: 'src/HostManagement/HostManagement.csproj'
  before_script:
    - *install_project_prerequisites
  script:
    - *publish_project
  artifacts:

xUnit:
  extends: .dotnet-test-xunit

Create artifacts arm64:
  stage: artifacts
  image: jfrog.i40.ifm-datalink.net:443/docker-remote/debian:11
  variables:
    DOTNET_ARCH: 'linux-arm64'
    MINIO_ARCH: 'linux-arm64'
    DIRECTORY: 'artifacts'
    PROJECT: 'src/HostManagement/HostManagement.csproj'
  before_script:
    - *install_project_prerequisites
    - *install_dotnet
    - *set_up_minio_client
  script:
    - *publish_project
    - *create_artifacts
  artifacts:
    paths:
      - artifacts.tar.gz
    expire_in: 30 days
  tags:
    - linux
    - docker
    - arm64
  when: manual
  rules:
    - <<: *rules_tag_manual
    - <<: *rules_default_branch
    - <<: *rules_merge_request
    - <<: *rules_web

Create artifacts x64:
  stage: artifacts
  image: jfrog.i40.ifm-datalink.net:443/docker-remote/debian:11
  variables:
    DOTNET_ARCH: 'linux-x64'
    MINIO_ARCH: 'linux-amd64'
    DIRECTORY: 'artifacts'
    PROJECT: 'src/HostManagement/HostManagement.csproj'
  before_script:
    - *install_project_prerequisites
    - *install_dotnet
    - *set_up_minio_client
  script:
    - *publish_project
    - *create_artifacts
  artifacts:
    paths:
      - artifacts.tar.gz
    expire_in: 30 days
  tags:
    - linux
    - docker
    - x64
  when: manual
  rules:
    - <<: *rules_tag_manual
    - <<: *rules_default_branch
    - <<: *rules_merge_request
    - <<: *rules_web

Versioning:
  stage: artifacts
  image: jfrog.i40.ifm-datalink.net:443/docker-remote/debian:11
  script:
    - echo "APP_PIPELINE=${CI_PIPELINE_ID}" >>version.env
    - echo "APP_VERSION=$(cat VERSION)" >>version.env
    - echo "APP_TAG=${CI_COMMIT_TAG}" >>version.env
    - cat version.env
  artifacts:
    reports:
      dotenv: version.env
    expire_in: 30 days
  tags:
    - linux
    - docker
  when: manual
  rules:
    - <<: *rules_tag_manual
    - <<: *rules_default_branch
    - <<: *rules_merge_request
    - <<: *rules_web

trigger deb packaging:
  stage: packaging
  variables:
    APP_PIPELINE: ${APP_PIPELINE}
    APP_VERSION: ${APP_VERSION}
    APP_TAG: ${APP_TAG}
  trigger:
    project: 'acx/vo-suite/hostmanagement-deb-packaging'
    strategy: depend
  needs:
    - "Create artifacts arm64"
    - "Create artifacts x64"
    - job: "Versioning"
      artifacts: true
  when: manual
  rules:
    - <<: *rules_tag_manual
    - <<: *rules_default_branch
    - <<: *rules_merge_request
    - <<: *rules_web

Deploy Shared NuGet:
  extends: .dotnet-deploy-nuget
  variables:
    PROJECT: 'src/HostManagement.Shared/HostManagement.Shared.csproj'
    REPO: 'JFrogViciOne'

Deploy Shared.Communication NuGet:
  extends: .dotnet-deploy-nuget
  variables:
    PROJECT: 'src/HostManagement.Shared.Communication/HostManagement.Shared.Communication.csproj'
    REPO: 'JFrogViciOne'

Release Shared NuGet:
  extends: .dotnet-release-nuget
  variables:
    PROJECT: 'src/HostManagement.Shared/HostManagement.Shared.csproj'
    REPO: 'JFrogViciOne'

Release Shared.Communication NuGet:
  extends: .dotnet-release-nuget
  variables:
    PROJECT: 'src/HostManagement.Shared.Communication/HostManagement.Shared.Communication.csproj'
    REPO: 'JFrogViciOne'
