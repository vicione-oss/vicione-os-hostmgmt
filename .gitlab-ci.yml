include:
  - project: 'vicione-oss/tooling/templates'
    file: '/CI-Templates/v2/dotnet.yml'

variables:
  DOTNET_VERSION: 9.0.307
  PACKAGE_NAME: "ci-artifacts"
  ARTIFACT_PREFIX: "hostmanagement"
  DEB_PACKAGING_PROJECT: 'vicione-oss/vicione/os/deb-packaging'
  DEB_PACKAGING_BRANCH: 'feature/replace-s3-with-package-registry'

stages:
  - lint
  - build
  - test
  - artifacts
  - packaging
  - deploy
  - release
  - release-public
  - cleanup

default:
  image: mcr.microsoft.com/dotnet/sdk:${DOTNET_VERSION}

#################### Rules

.rules_default_branch: &rules_default_branch
  if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

.rules_merge_request: &rules_merge_request
  if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

.rules_merge_request_manual: &rules_merge_request_manual
  if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  when: manual
  allow_failure: true

.rules_web: &rules_web
  if: '$CI_PIPELINE_SOURCE == "web"'

.rules_web_manual: &rules_web_manual
  if: '$CI_PIPELINE_SOURCE == "web"'
  when: manual
  allow_failure: true

.rules_tag_manual: &rules_tag_manual
  if: '$CI_COMMIT_TAG'
  when: manual
  allow_failure: true

.rules_scheduled: &rules_scheduled
  if: '$CI_PIPELINE_SOURCE == "schedule"'

#################### Common

.install_project_prerequisites: &install_project_prerequisites
  - apt update && apt install -y clang zlib1g-dev

.install_dotnet: &install_dotnet
  - apt update && apt install -y wget libicu-dev
  - wget https://dot.net/v1/dotnet-install.sh -O dotnet-install.sh
  - chmod +x dotnet-install.sh
  - ./dotnet-install.sh --version ${DOTNET_VERSION}
  - export PATH="${PATH}:/root/.dotnet"
  - dotnet --version

.publish_project: &publish_project
  - !reference [.nuget_credentials]
  - !reference [.prepare_directory]
  - dotnet publish -r "${DOTNET_ARCH}" -o "${ABSOLUTE_DIRECTORY}" "${PROJECT}"
  - ls -larth "${ABSOLUTE_DIRECTORY}"

.create_artifacts: &create_artifacts
  - du -sh ./${DIRECTORY}/
  - rm -rf ./${DIRECTORY}/*.xml ./${DIRECTORY}/*.dbg ./${DIRECTORY}/*.pdb
  - du -sh ./${DIRECTORY}/
  - tar cfz ${DIRECTORY}.tar.gz ./${DIRECTORY}
  - export PACKAGE_VERSION="${CI_PIPELINE_ID}"
  - source build/package_registry.sh
  - registry::upload "${DIRECTORY}.tar.gz" "${ARTIFACT_PREFIX}-${CI_PIPELINE_ID}-${DOTNET_ARCH}.tar.gz"

.jfrog-package-release:
  stage: deploy
  image: releases-docker.jfrog.io/jfrog/jfrog-cli-v2-jf
  variables:
    SERVER: "https://ifm.jfrog.io/artifactory"
    USER: ${Raw_User_RW_JFrog}
    PASSWORD: ${Raw_PW_RW_JFrog}
    REPOSITORY_DESTINATION: "vicione-suite-dev"
  before_script:
    - apk add --no-cache curl jq
    - jf config add --user $USER --password ${PASSWORD} --artifactory-url ${SERVER} jfrog
    - jf config use jfrog
  script:
    - APP_PIPELINE="${CI_PIPELINE_ID}"
    - APP_VERSION="$(cat VERSION)"
    - APP_TAG="${CI_COMMIT_TAG}"
    - VERSION="${APP_VERSION}"
    - if [[ -z "${APP_TAG}" ]]; then VERSION="${VERSION}~${APP_PIPELINE}"; fi
    - echo "${ARTIFACT_PREFIX}_${VERSION}_amd64.deb" >> artifacts.list
    - echo "${ARTIFACT_PREFIX}_${VERSION}_arm64.deb" >> artifacts.list
    - |
      while IFS= read -r artifact; do
        echo "Processing: ${artifact}"
        if [[ "${artifact}" == *.deb ]]; then
          curl --fail --silent --show-error \
            --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
            --output "${artifact}" \
            "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/${PACKAGE_NAME}/${APP_PIPELINE}/${artifact}"
          jf rt upload "${artifact}" "${REPOSITORY_DESTINATION}/hostmanagements/${artifact}"
        fi
      done < artifacts.list
    - |
      PACKAGE_ID=$(curl --silent --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages?package_name=${PACKAGE_NAME}&per_page=100" \
        | jq -r ".[] | select(.version == \"${APP_PIPELINE}\") | .id")
      if [ -n "$PACKAGE_ID" ] && [ "$PACKAGE_ID" != "null" ]; then
        echo "Cleaning up package version ${APP_PIPELINE}"
        curl --silent --request DELETE --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
          "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/${PACKAGE_ID}" || true
      fi
  artifacts:
    paths:
      - ${ARTIFACT_PREFIX}_*.deb
      - artifacts.list
  when: manual
  rules:
    - <<: *rules_merge_request_manual
    - <<: *rules_web_manual

#################### Lint stage

Markdown:
  stage: lint
  image:
    name: davidanson/markdownlint-cli2:latest
    entrypoint: ["/bin/sh", "-c"]
  script:
    - markdownlint-cli2 "/builds/**/*.md" "#/builds/**/.gitlab/**"
  rules:
    - <<: *rules_tag_manual
      changes:
        - "**/*.md"
    - <<: *rules_default_branch
      changes:
        - "**/*.md"
    - <<: *rules_merge_request
      changes:
        - "**/*.md"
    - <<: *rules_web
      changes:
        - "**/*.md"

#################### Build stage

Build:
  extends: .dotnet-build

#################### Test stage

xUnit:
  extends: .dotnet-test-xunit

#################### Artifacts stage

Create artifacts arm64:
  stage: artifacts
  image: debian:11
  variables:
    DOTNET_ARCH: 'linux-arm64'
    DIRECTORY: 'artifacts'
    PROJECT: 'src/HostManagement/HostManagement.csproj'
  before_script:
    - *install_project_prerequisites
    - *install_dotnet
    - apt update && apt install -y curl
  script:
    - *publish_project
    - *create_artifacts
  artifacts:
    paths:
      - artifacts.tar.gz
    expire_in: 30 days
  tags:
    - saas-linux-small-arm64
  when: manual
  rules:
    - <<: *rules_tag_manual
    - <<: *rules_default_branch
    - <<: *rules_merge_request
    - <<: *rules_web

Create artifacts x64:
  stage: artifacts
  image: debian:11
  variables:
    DOTNET_ARCH: 'linux-x64'
    DIRECTORY: 'artifacts'
    PROJECT: 'src/HostManagement/HostManagement.csproj'
  before_script:
    - *install_project_prerequisites
    - *install_dotnet
    - apt update && apt install -y curl
  script:
    - *publish_project
    - *create_artifacts
  artifacts:
    paths:
      - artifacts.tar.gz
    expire_in: 30 days
  when: manual
  rules:
    - <<: *rules_tag_manual
    - <<: *rules_default_branch
    - <<: *rules_merge_request
    - <<: *rules_web

Versioning:
  stage: artifacts
  image: debian:11
  script:
    - echo "APP_PIPELINE=${CI_PIPELINE_ID}" >>version.env
    - echo "APP_VERSION=$(cat VERSION)" >>version.env
    - echo "APP_TAG=${CI_COMMIT_TAG}" >>version.env
    - cat version.env
  artifacts:
    reports:
      dotenv: version.env
    expire_in: 30 days
  when: manual
  rules:
    - <<: *rules_tag_manual
    - <<: *rules_default_branch
    - <<: *rules_merge_request
    - <<: *rules_web

#################### Packaging stage

trigger deb packaging:
  stage: packaging
  variables:
    APP_PIPELINE: ${APP_PIPELINE}
    APP_VERSION: ${APP_VERSION}
    APP_TAG: ${APP_TAG}
    PARENT_PROJECT_ID: ${CI_PROJECT_ID}
    ARTIFACT_PREFIX: "hostmanagement"
  trigger:
    project: ${DEB_PACKAGING_PROJECT}
    branch: ${DEB_PACKAGING_BRANCH}
    strategy: depend
  needs:
    - "Create artifacts arm64"
    - "Create artifacts x64"
    - job: "Versioning"
      artifacts: true
  when: manual
  rules:
    - <<: *rules_tag_manual
    - <<: *rules_default_branch
    - <<: *rules_merge_request
    - <<: *rules_web

#################### Deploy stage

Test Package Registry:
  stage: deploy
  image: debian:11
  before_script:
    - apt-get update && apt-get install -qq -y curl jq
  script:
    - export PACKAGE_VERSION="${CI_PIPELINE_ID}"
    - source build/package_registry.sh
    - |
      basic::log "Package Registry Connectivity Test"
      basic::log "Project: ${CI_PROJECT_ID} | Pipeline: ${CI_PIPELINE_ID}"
    - |
      for arch in "linux-x64" "linux-arm64"; do
        artifact="${ARTIFACT_PREFIX}-${PACKAGE_VERSION}-${arch}.tar.gz"
        export DOWNLOAD_PROJECT_ID="${CI_PROJECT_ID}"
        registry::download "${artifact}" "${artifact}"
      done
    - registry::delete_version "${PACKAGE_VERSION}"
    - basic::log "Test Complete"
  needs:
    - "trigger deb packaging"
  when: manual
  allow_failure: true
  rules:
    - <<: *rules_tag_manual
    - <<: *rules_default_branch
    - <<: *rules_merge_request
    - <<: *rules_web
  tags:
    - saas-linux-medium-amd64

Deploy Shared NuGet:
  extends: .dotnet-deploy-nuget
  variables:
    PROJECT: 'src/HostManagement.Shared/HostManagement.Shared.csproj'
    REPO: 'JFrogViciOne'

Deploy Shared.Communication NuGet:
  extends: .dotnet-deploy-nuget
  variables:
    PROJECT: 'src/HostManagement.Shared.Communication/HostManagement.Shared.Communication.csproj'
    REPO: 'JFrogViciOne'

Prerelease Packages to JFrog:
  extends: .jfrog-package-release
  variables:
    SERVER: "https://ifm.jfrog.io/artifactory"
    USER: ${Raw_User_RW_JFrog}
    PASSWORD: ${Raw_PW_RW_JFrog}
    REPOSITORY_DESTINATION: "vicione-suite-dev"
  needs:
    - "trigger deb packaging"

#################### Release stage

Release Shared NuGet:
  extends: .dotnet-release-nuget
  variables:
    PROJECT: 'src/HostManagement.Shared/HostManagement.Shared.csproj'
    REPO: 'JFrogViciOne'

Release Shared.Communication NuGet:
  extends: .dotnet-release-nuget
  variables:
    PROJECT: 'src/HostManagement.Shared.Communication/HostManagement.Shared.Communication.csproj'
    REPO: 'JFrogViciOne'

Release Packages to JFrog:
  extends: .jfrog-package-release
  stage: release
  variables:
    SERVER: "https://ifm.jfrog.io/artifactory"
    USER: ${Raw_User_RW_JFrog}
    PASSWORD: ${Raw_PW_RW_JFrog}
    REPOSITORY_DESTINATION: "vicione-suite-staging"
  needs:
    - "trigger deb packaging"
  rules:
    - <<: *rules_tag_manual

#################### Release Public stage

Public-Release Packages to JFrog:
  extends: .jfrog-package-release
  stage: release-public
  variables:
    SERVER: "https://ifm.jfrog.io/artifactory"
    USER: ${Raw_User_RW_JFrog}
    PASSWORD: ${Raw_PW_RW_JFrog}
    REPOSITORY_SOURCE: "vicione-suite-staging"
    REPOSITORY_DESTINATION: "vicione-suite"
  script:
    - |
      while IFS= read -r artifact; do
        if [[ "${artifact}" == *.deb ]]; then
          source="${REPOSITORY_SOURCE}/*/${artifact}"
          destination="${REPOSITORY_DESTINATION}/${artifact}"
          echo "Moving: ${source} -> ${destination}"
          jf rt mv "${source}" "${destination}"
        fi
      done < artifacts.list
  needs:
    - "Release Packages to JFrog"
  rules:
    - <<: *rules_tag_manual

#################### Cleanup stage

Cleanup orphaned packages:
  stage: cleanup
  image: debian:11
  before_script:
    - apt update && apt install -y curl jq
  script:
    - source build/package_registry.sh
    - registry::cleanup_old 4
  rules:
    - <<: *rules_scheduled
  tags:
    - saas-linux-medium-amd64
