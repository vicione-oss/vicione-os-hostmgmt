include:
  - project: 'vicione-oss/tooling/templates'
    file: '/CI-Templates/v2/dotnet.yml'

  # Version component for automatic semantic versioning
  - component: $CI_SERVER_FQDN/vicione-oss/tooling/components/version/auto-tag@v0.1.5

  # Registry components for artifact storage
  - component: $CI_SERVER_FQDN/vicione-oss/tooling/components/registry/upload@v0.1.2
    inputs:
      name: "Upload artifacts arm64"
      stage: artifacts
      file: "artifacts.tar.gz"
      remote_name: "${ARTIFACT_PREFIX}-${CI_PIPELINE_ID}-linux-arm64.tar.gz"
      package_name: $PACKAGE_NAME
      rules:
        - if: '$CI_COMMIT_TAG'
          when: manual
          allow_failure: true
        - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
        - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
        - if: '$CI_PIPELINE_SOURCE == "web"'
      tags: ["saas-linux-small-arm64"]

  - component: $CI_SERVER_FQDN/vicione-oss/tooling/components/registry/upload@v0.1.2
    inputs:
      name: "Upload artifacts x64"
      stage: artifacts
      file: "artifacts.tar.gz"
      remote_name: "${ARTIFACT_PREFIX}-${CI_PIPELINE_ID}-linux-x64.tar.gz"
      package_name: $PACKAGE_NAME
      rules:
        - if: '$CI_COMMIT_TAG'
          when: manual
          allow_failure: true
        - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
        - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
        - if: '$CI_PIPELINE_SOURCE == "web"'

  - component: $CI_SERVER_FQDN/vicione-oss/tooling/components/registry/cleanup@v0.1.2
    inputs:
      name: "Cleanup old packages"
      stage: cleanup
      package_name: $PACKAGE_NAME
      hours: "4"
      rules:
        - if: '$CI_PIPELINE_SOURCE == "schedule"'

  # JFrog components for artifact releases
  - component: $CI_SERVER_FQDN/vicione-oss/tooling/components/jfrog/release@v0.1.0
    inputs:
      name: "Prerelease Packages to JFrog"
      stage: deploy
      repository: "vicione-suite-dev"
      upload_path: "hostmanagements"
      artifact_prefix: "hostmanagement"
      package_name: "ci-artifacts"
      rules:
        - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
          when: manual
          allow_failure: true
        - if: '$CI_PIPELINE_SOURCE == "web"'
          when: manual
          allow_failure: true

  - component: $CI_SERVER_FQDN/vicione-oss/tooling/components/jfrog/release@v0.1.0
    inputs:
      name: "Release Packages to JFrog"
      stage: release
      repository: "vicione-suite-staging"
      upload_path: "hostmanagements"
      artifact_prefix: "hostmanagement"
      package_name: "ci-artifacts"
      rules:
        - if: '$CI_COMMIT_TAG'
          when: manual
          allow_failure: true

  - component: $CI_SERVER_FQDN/vicione-oss/tooling/components/jfrog/promote@v0.1.0
    inputs:
      name: "Public-Release Packages to JFrog"
      stage: release-public
      source_repository: "vicione-suite-staging"
      destination_repository: "vicione-suite"
      artifact_prefix: "hostmanagement"
      rules:
        - if: '$CI_COMMIT_TAG'
          when: manual
          allow_failure: true

variables:
  VICIONE_IMAGE: registry.gitlab.com/vicione-oss/tooling/base-image:vicione-latest
  RestoreLockedMode: "false"  # Disable for SDK compatibility - lock files still committed for local dev
  PACKAGE_NAME: "ci-artifacts"
  ARTIFACT_PREFIX: "hostmanagement"
  DEB_PACKAGING_PROJECT: 'vicione-oss/vicione/os/deb-packaging'
  DEB_PACKAGING_REF: 'v0.1.2'  # Use tagged version of deb-packaging

stages:
  - lint
  - build
  - test
  - artifacts
  - packaging
  - deploy
  - release
  - release-public
  - cleanup

default:
  image: $VICIONE_IMAGE
  before_script:
    - mise trust --all
    - mise install
    - eval "$(mise env -s bash)"

#################### Rules

.rules_default_branch: &rules_default_branch
  if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'

.rules_merge_request: &rules_merge_request
  if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

.rules_merge_request_manual: &rules_merge_request_manual
  if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  when: manual
  allow_failure: true

.rules_web: &rules_web
  if: '$CI_PIPELINE_SOURCE == "web"'

.rules_web_manual: &rules_web_manual
  if: '$CI_PIPELINE_SOURCE == "web"'
  when: manual
  allow_failure: true

.rules_tag_manual: &rules_tag_manual
  if: '$CI_COMMIT_TAG'
  when: manual
  allow_failure: true

.rules_scheduled: &rules_scheduled
  if: '$CI_PIPELINE_SOURCE == "schedule"'

#################### Common

.publish_project: &publish_project
  - !reference [.nuget_credentials]
  - !reference [.prepare_directory]
  - dotnet publish -r "${DOTNET_ARCH}" -o "${ABSOLUTE_DIRECTORY}" "${PROJECT}"
  - ls -larth "${ABSOLUTE_DIRECTORY}"

# Build artifacts only - upload is handled by registry component
.create_artifacts: &create_artifacts
  - du -sh ./${DIRECTORY}/
  - rm -rf ./${DIRECTORY}/*.xml ./${DIRECTORY}/*.dbg ./${DIRECTORY}/*.pdb
  - du -sh ./${DIRECTORY}/
  - tar cfz ${DIRECTORY}.tar.gz ./${DIRECTORY}
  - ls -lh ${DIRECTORY}.tar.gz

#################### Lint stage

Markdown:
  stage: lint
  image: $VICIONE_IMAGE
  script:
    - npm install -g markdownlint-cli2
    - markdownlint-cli2 "/builds/**/*.md" "#/builds/**/.gitlab/**"
  rules:
    - <<: *rules_tag_manual
      changes:
        - "**/*.md"
    - <<: *rules_default_branch
      changes:
        - "**/*.md"
    - <<: *rules_merge_request
      changes:
        - "**/*.md"
    - <<: *rules_web
      changes:
        - "**/*.md"

#################### Build stage

Build:
  extends: .dotnet-build

#################### Test stage

xUnit:
  extends: .dotnet-test-xunit

#################### Artifacts stage

Build artifacts arm64:
  stage: artifacts
  image: $VICIONE_IMAGE
  variables:
    DOTNET_ARCH: 'linux-arm64'
    DIRECTORY: 'artifacts'
    PROJECT: 'src/HostManagement/HostManagement.csproj'
  script:
    - *publish_project
    - *create_artifacts
  artifacts:
    paths:
      - artifacts.tar.gz
    expire_in: 30 days
  tags:
    - saas-linux-small-arm64
  when: manual
  rules:
    - <<: *rules_tag_manual
    - <<: *rules_default_branch
    - <<: *rules_merge_request
    - <<: *rules_web

Build artifacts x64:
  stage: artifacts
  image: $VICIONE_IMAGE
  variables:
    DOTNET_ARCH: 'linux-x64'
    DIRECTORY: 'artifacts'
    PROJECT: 'src/HostManagement/HostManagement.csproj'
  script:
    - *publish_project
    - *create_artifacts
  artifacts:
    paths:
      - artifacts.tar.gz
    expire_in: 30 days
  when: manual
  rules:
    - <<: *rules_tag_manual
    - <<: *rules_default_branch
    - <<: *rules_merge_request
    - <<: *rules_web

# Upload jobs are created by registry component includes above
# They will automatically pick up artifacts.tar.gz from build jobs

# Configure upload job dependencies (use VICIONE_IMAGE instead of curl - has mise + cached)
Upload artifacts arm64:
  image: $VICIONE_IMAGE
  needs:
    - job: "Build artifacts arm64"
      artifacts: true

Upload artifacts x64:
  image: $VICIONE_IMAGE
  needs:
    - job: "Build artifacts x64"
      artifacts: true

Versioning:
  stage: artifacts
  image: $VICIONE_IMAGE
  script:
    - echo "APP_PIPELINE=${CI_PIPELINE_ID}" >>version.env
    - echo "APP_VERSION=$(cat VERSION)" >>version.env
    - echo "APP_TAG=${CI_COMMIT_TAG}" >>version.env
    - cat version.env
  artifacts:
    reports:
      dotenv: version.env
    expire_in: 30 days
  when: manual
  rules:
    - <<: *rules_tag_manual
    - <<: *rules_default_branch
    - <<: *rules_merge_request
    - <<: *rules_web

#################### Packaging stage

trigger deb packaging:
  stage: packaging
  variables:
    APP_PIPELINE: ${APP_PIPELINE}
    APP_VERSION: ${APP_VERSION}
    APP_TAG: ${APP_TAG}
    PARENT_PROJECT_ID: ${CI_PROJECT_ID}
    ARTIFACT_PREFIX: "hostmanagement"
  trigger:
    project: ${DEB_PACKAGING_PROJECT}
    branch: ${DEB_PACKAGING_REF}
    strategy: depend
  needs:
    - "Upload artifacts arm64"
    - "Upload artifacts x64"
    - job: "Versioning"
      artifacts: true
  when: manual
  rules:
    - <<: *rules_tag_manual
    - <<: *rules_default_branch
    - <<: *rules_merge_request
    - <<: *rules_web

#################### Deploy stage

Test Registry:
  stage: deploy
  image: $VICIONE_IMAGE
  script:
    - bash build/test_registry.sh
  when: manual
  allow_failure: true
  rules:
    - <<: *rules_tag_manual
    - <<: *rules_default_branch
    - <<: *rules_merge_request
    - <<: *rules_web

Test JFrog:
  stage: deploy
  image: $VICIONE_IMAGE
  variables:
    TEST_REPO: "vicione-suite-dev"
  script:
    - bash build/test_jfrog.sh
  when: manual
  allow_failure: true
  rules:
    - <<: *rules_tag_manual
    - <<: *rules_default_branch
    - <<: *rules_merge_request
    - <<: *rules_web

Deploy Shared NuGet:
  extends: .dotnet-deploy-nuget
  variables:
    PROJECT: 'src/HostManagement.Shared/HostManagement.Shared.csproj'
    REPO: 'JFrogViciOne'

Deploy Shared.Communication NuGet:
  extends: .dotnet-deploy-nuget
  variables:
    PROJECT: 'src/HostManagement.Shared.Communication/HostManagement.Shared.Communication.csproj'
    REPO: 'JFrogViciOne'

# JFrog release jobs are created by jfrog component includes above

# Configure JFrog job dependencies
Prerelease Packages to JFrog:
  needs:
    - "trigger deb packaging"

Release Packages to JFrog:
  needs:
    - "trigger deb packaging"

Public-Release Packages to JFrog:
  needs:
    - "Release Packages to JFrog"

#################### Release stage

Release Shared NuGet:
  extends: .dotnet-release-nuget
  variables:
    PROJECT: 'src/HostManagement.Shared/HostManagement.Shared.csproj'
    REPO: 'JFrogViciOne'

Release Shared.Communication NuGet:
  extends: .dotnet-release-nuget
  variables:
    PROJECT: 'src/HostManagement.Shared.Communication/HostManagement.Shared.Communication.csproj'
    REPO: 'JFrogViciOne'

#################### Cleanup stage
# Cleanup job is created by registry component include above
