variables:
  VICIONE_IMAGE: registry.gitlab.com/vicione-oss/tooling/base-image:vicione-latest
  PACKAGE_NAME: "ci-artifacts"
  ARTIFACT_PREFIX: "hostmanagement"
  DEB_PACKAGING_PROJECT: 'vicione-oss/vicione/os/deb-packaging'
  DEB_PACKAGING_BRANCH: 'master'
  RUNNER_TAG: saas-linux-large-amd64

#################### Rules

.rule_tag: &rule_tag
  if: "$CI_COMMIT_TAG"

.rule_tag_manual: &rule_tag_manual
  <<: *rule_tag
  when: manual
  allow_failure: true

.rule_default_branch: &rule_default_branch
  if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH"

.rule_default_branch_manual: &rule_default_branch_manual
  <<: *rule_default_branch
  when: manual
  allow_failure: true

.rule_mr: &rule_mr
  if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

.rule_mr_manual: &rule_mr_manual
  <<: *rule_mr
  when: manual
  allow_failure: true

.rule_web: &rule_web
  if: '$CI_PIPELINE_SOURCE == "web"'

.rule_web_manual: &rule_web_manual
  <<: *rule_web
  when: manual
  allow_failure: true

.rules: &rules
  - *rule_tag
  - *rule_default_branch
  - *rule_mr
  - *rule_web

.rules_manual: &rules_manual
  - *rule_tag_manual
  - *rule_default_branch_manual
  - *rule_mr_manual
  - *rule_web_manual

.rules_manual_tag: &rules_manual_tag
  - *rule_tag_manual
  - *rule_default_branch
  - *rule_mr
  - *rule_web

#################### Common

.activate_mise: &activate_mise
  - mise install
  - eval "$(mise env)"

.update_nuget_source_ro: &update_nuget_source_ro
  - dotnet nuget update source JFrogNuGetProxy --configfile NuGet.Config -u $NuGet_User_JFrog -p $NuGet_PW_JFrog --store-password-in-clear-text
  - dotnet nuget update source JFrogViciOne --configfile NuGet.Config -u $NuGet_User_JFrog -p $NuGet_PW_JFrog --store-password-in-clear-text

.update_nuget_source_rw: &update_nuget_source_rw
  - dotnet nuget update source JFrogViciOne --configfile NuGet.Config -u $NuGet_User_RW_JFrog -p $NuGet_PW_RW_JFrog --store-password-in-clear-text

#################### Jobs

stages:
  - lint
  - build
  - test
  - packaging
  - publish
  - cleanup

Version:
  stage: .pre
  rules: *rules
  script:
    - if [[ -f "VERSION" ]]; then VERSION=$(head -n 1 VERSION); fi
    - if [[ ! -z "${CI_COMMIT_TAG}" ]]; then VERSION=$(echo $CI_COMMIT_TAG | sed 's/v//g'); fi
    - if [[ -z "${VERSION}" ]]; then VERSION='0.1.0'; fi
    - if [[ -z "${CI_COMMIT_TAG}" ]]; then VERSION="${VERSION}-ci${CI_PIPELINE_ID}"; fi
    - echo "Version=${VERSION}" >> version.env
    - echo "PackageVersion=${VERSION}" >> version.env
    - echo "APP_PIPELINE=${CI_PIPELINE_ID}" >> version.env
    - echo "APP_VERSION=$(cat VERSION)" >> version.env
    - echo "APP_TAG=${CI_COMMIT_TAG}" >> version.env
    - cat version.env
  artifacts:
    reports:
      dotenv: version.env

.publish_matrix: &publish_matrix
  - OS: linux
    ARCH: x64
    RUNNER_ARCH: amd64
  - OS: linux
    ARCH: arm64
    RUNNER_ARCH: arm64

include:
  - project: 'vicione-oss/tooling/templates'
    file: '/CI-Templates/v2/dotnet.yml'

  # Registry components for artifact storage
  - component: $CI_SERVER_FQDN/vicione-oss/tooling/components/registry/upload@v0.1.2
    inputs:
      name: "Upload binaries arm64"
      stage: packaging
      file: "artifacts.tar.gz"
      remote_name: "${ARTIFACT_PREFIX}-${CI_PIPELINE_ID}-linux-arm64.tar.gz"
      package_name: $PACKAGE_NAME
      rules: *rules_manual_tag

  - component: $CI_SERVER_FQDN/vicione-oss/tooling/components/registry/upload@v0.1.2
    inputs:
      name: "Upload binaries x64"
      stage: packaging
      file: "artifacts.tar.gz"
      remote_name: "${ARTIFACT_PREFIX}-${CI_PIPELINE_ID}-linux-x64.tar.gz"
      package_name: $PACKAGE_NAME
      rules: *rules_manual_tag

  - component: $CI_SERVER_FQDN/vicione-oss/tooling/components/registry/cleanup@v0.1.2
    inputs:
      name: "Cleanup old packages"
      stage: cleanup
      package_name: $PACKAGE_NAME
      hours: "4"
      rules:
        - if: '$CI_PIPELINE_SOURCE == "schedule"'

  # Build & Test
  - component: $CI_SERVER_FQDN/vicione-oss/tooling/dotnet-component/dotnet-restore@2.2.4
    inputs:
      image: $VICIONE_IMAGE
      rules: *rules
      before_script:
        - *activate_mise
        - *update_nuget_source_ro
      tags:
        - $RUNNER_TAG
      execution_matrix:
        - OS: linux
          ARCH: x64
          RUNNER_ARCH: amd64
        - OS: linux
          ARCH: arm64
          RUNNER_ARCH: arm64
        - PLACEHOLDER: all
  - component: $CI_SERVER_FQDN/vicione-oss/tooling/dotnet-component/dotnet-build@2.2.4
    inputs:
      image: $VICIONE_IMAGE
      rules: *rules
      before_script:
        - *activate_mise
        - echo "$Version"
      tags:
        - $RUNNER_TAG
  - component: $CI_SERVER_FQDN/vicione-oss/tooling/dotnet-component/dotnet-publish@2.2.4
    inputs:
      image: $VICIONE_IMAGE
      rules: *rules_manual
      before_script:
        - *activate_mise
      tags:
        - saas-linux-large-$RUNNER_ARCH
      project: src/HostManagement/HostManagement.csproj
      execution_matrix: *publish_matrix
      self_contained: true
  - component: $CI_SERVER_FQDN/vicione-oss/tooling/dotnet-component/dotnet-test@2.2.4
    inputs:
      image: $VICIONE_IMAGE
      rules: *rules_manual_tag
      before_script:
        - *activate_mise
        - *update_nuget_source_ro
      tags:
        - $RUNNER_TAG
      coverage: true

  # NuGet Packages
  - component: $CI_SERVER_FQDN/vicione-oss/tooling/dotnet-component/dotnet-pack@2.2.4
    inputs:
      image: $VICIONE_IMAGE
      stage: packaging
      rules: *rules_manual
      before_script:
        - *activate_mise
        - echo "${PackageVersion}"
      tags:
        - $RUNNER_TAG
  - component: $CI_SERVER_FQDN/vicione-oss/tooling/dotnet-component/dotnet-nuget-push@2.2.4
    inputs:
      image: $VICIONE_IMAGE
      stage: publish
      source: "JFrogViciOne"
      filename_pattern: "./src/*"
      rules: *rules_manual
      before_script:
        - *activate_mise
        - *update_nuget_source_rw

  # JFrog components for artifact releases
  - component: $CI_SERVER_FQDN/vicione-oss/tooling/components/jfrog/release@v0.1.0
    inputs:
      name: "Prerelease Debian"
      stage: publish
      repository: "vicione-suite-dev"
      upload_path: "hostmanagements"
      artifact_prefix: "hostmanagement"
      package_name: "ci-artifacts"
      rules:
        - *rule_mr_manual
        - *rule_web_manual

  - component: $CI_SERVER_FQDN/vicione-oss/tooling/components/jfrog/release@v0.1.0
    inputs:
      name: "Release Debian to staging"
      stage: publish
      repository: "vicione-suite-staging"
      upload_path: "hostmanagements"
      artifact_prefix: "hostmanagement"
      package_name: "ci-artifacts"
      rules:
        - *rule_tag_manual

  - component: $CI_SERVER_FQDN/vicione-oss/tooling/components/jfrog/promote@v0.1.0
    inputs:
      name: "Release Debian to public"
      stage: publish
      source_repository: "vicione-suite-staging"
      destination_repository: "vicione-suite"
      artifact_prefix: "hostmanagement"
      rules:
        - *rule_tag_manual

#################### Lint stage

Markdown:
  stage: lint
  needs: []
  image:
    name: davidanson/markdownlint-cli2:v0.21.0
    entrypoint: ["/bin/sh", "-c"]
  script:
    - markdownlint-cli2 "**/*.md"
  rules:
    - <<: *rule_tag_manual
      changes:
        - "**/*.md"
    - <<: *rule_default_branch
      changes:
        - "**/*.md"
    - <<: *rule_mr
      changes:
        - "**/*.md"
    - <<: *rule_web
      changes:
        - "**/*.md"

#################### Packaging stage

Pack binaries:
  stage: packaging
  parallel:
    matrix: *publish_matrix
  needs:
    - job: "dotnet Publish"
      parallel:
        matrix:
          - OS: $[[ matrix.OS ]]
            ARCH: $[[ matrix.ARCH ]]
            RUNNER_ARCH: $[[ matrix.RUNNER_ARCH ]]
  variables:
    INPUT_DIRECTORY: "src/HostManagement/bin/Release/net10.0/$OS-$ARCH/publish"
    OUTPUT_DIRECTORY: "artifacts"
  script:
    - mv $INPUT_DIRECTORY $OUTPUT_DIRECTORY
    - du -sh ./${OUTPUT_DIRECTORY}/
    - rm -rf ./${OUTPUT_DIRECTORY}/*.xml ./${OUTPUT_DIRECTORY}/*.dbg ./${OUTPUT_DIRECTORY}/*.pdb
    - du -sh ./${OUTPUT_DIRECTORY}/
    - tar cfz artifacts.tar.gz ./${OUTPUT_DIRECTORY}
    - ls -lh artifacts.tar.gz
  artifacts:
    paths:
      - artifacts.tar.gz
    expire_in: 30 days
  rules: *rules_manual_tag

# Upload jobs are created by registry component includes above
# They will automatically pick up artifacts.tar.gz from build jobs
Upload binaries arm64:
  needs:
    - job: "Pack binaries"
      parallel:
        matrix:
          - OS: linux
            ARCH: arm64
            RUNNER_ARCH: arm64

Upload binaries x64:
  needs:
    - job: "Pack binaries"
      parallel:
        matrix:
          - OS: linux
            ARCH: x64
            RUNNER_ARCH: amd64

Trigger Debian packaging:
  stage: packaging
  variables:
    APP_PIPELINE: ${APP_PIPELINE}
    APP_VERSION: ${APP_VERSION}
    APP_TAG: ${APP_TAG}
    PARENT_PROJECT_ID: ${CI_PROJECT_ID}
  trigger:
    project: ${DEB_PACKAGING_PROJECT}
    branch: ${DEB_PACKAGING_BRANCH}
    strategy: depend
  needs:
    - "Upload binaries arm64"
    - "Upload binaries x64"
    - Version
  when: manual
  rules: *rules_manual_tag

#################### Deploy stage

# JFrog release jobs are created by jfrog component includes above

# Configure JFrog job dependencies
Prerelease Debian:
  needs:
    - "Trigger Debian packaging"

Release Debian to staging:
  needs:
    - "Trigger Debian packaging"

Release Debian to public:
  needs:
    - "Release Debian to staging"

#################### Cleanup stage
# Cleanup job is created by registry component include above
